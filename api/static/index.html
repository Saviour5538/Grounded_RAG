<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grounded RAG</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3350;
      --accent: #6c63ff;
      --accent-hover: #5a52e0;
      --green: #34d399;
      --red: #f87171;
      --yellow: #fbbf24;
      --text: #e2e8f0;
      --muted: #8892a4;
      --radius: 10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ── Layout ── */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 18px 32px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .header-logo {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text);
    }
    .header-logo span { color: var(--accent); }
    .header-badge {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 12px;
      color: var(--muted);
    }
    .header-status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      color: var(--muted);
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }
    .dot.green { background: var(--green); }

    .main { max-width: 1100px; margin: 0 auto; padding: 32px 24px; display: grid; grid-template-columns: 380px 1fr; gap: 24px; }
    @media (max-width: 860px) { .main { grid-template-columns: 1fr; } }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
    }
    .card-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--muted);
      margin-bottom: 18px;
    }

    /* ── Drop zone ── */
    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 32px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }
    .drop-zone:hover, .drop-zone.drag-over {
      border-color: var(--accent);
      background: rgba(108, 99, 255, 0.06);
    }
    .drop-zone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer;
    }
    .drop-icon { font-size: 28px; margin-bottom: 8px; }
    .drop-primary { font-weight: 600; margin-bottom: 4px; }
    .drop-secondary { font-size: 13px; color: var(--muted); }
    .drop-hint {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
      background: var(--surface2);
      border-radius: 6px;
      padding: 6px 10px;
      display: inline-block;
    }
    .file-chosen {
      margin-top: 12px;
      padding: 8px 12px;
      background: var(--surface2);
      border-radius: 6px;
      font-size: 13px;
      display: none;
      align-items: center;
      gap: 8px;
    }
    .file-chosen.visible { display: flex; }
    .file-name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-size { color: var(--muted); font-size: 12px; white-space: nowrap; }

    /* ── Controls ── */
    .controls { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
    }
    .checkbox-row input { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, background 0.15s;
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #fff; width: 100%; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover:not(:disabled) { border-color: var(--accent); }

    /* ── Progress ── */
    .progress-wrap { margin-top: 18px; display: none; }
    .progress-wrap.visible { display: block; }
    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 6px;
    }
    .progress-label { font-weight: 500; }
    .progress-pct { color: var(--muted); }
    .progress-bar {
      height: 6px;
      background: var(--surface2);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 99px;
      width: 0%;
      transition: width 0.5s ease;
    }
    .progress-fill.done { background: var(--green); }
    .progress-fill.error { background: var(--red); }
    .progress-detail {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    .progress-detail span { display: flex; align-items: center; gap: 4px; }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      background: var(--surface2);
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .status-pill.running { color: var(--yellow); border-color: var(--yellow); }
    .status-pill.done    { color: var(--green);  border-color: var(--green); }
    .status-pill.error   { color: var(--red);    border-color: var(--red); }

    .error-msg {
      margin-top: 10px;
      padding: 10px 14px;
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.3);
      border-radius: 8px;
      font-size: 13px;
      color: var(--red);
    }

    /* ── Job history ── */
    .job-history { margin-top: 18px; }
    .job-history-title { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    .job-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      padding: 5px 0;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
    }
    .job-row:last-child { border-bottom: none; }
    .job-file { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }

    /* ── Query panel ── */
    .query-input-row {
      display: flex;
      gap: 10px;
    }
    input[type="text"] {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    input[type="text"]::placeholder { color: var(--muted); }

    /* ── Answer ── */
    .answer-wrap { margin-top: 20px; display: none; }
    .answer-wrap.visible { display: block; }
    .answer-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--muted);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .model-tag {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 7px;
      font-size: 11px;
      font-weight: 400;
      color: var(--muted);
      text-transform: none;
      letter-spacing: 0;
    }
    .answer-text {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      line-height: 1.7;
      font-size: 14px;
      white-space: pre-wrap;
    }
    .answer-text.abstain {
      color: var(--yellow);
      border-color: rgba(251, 191, 36, 0.3);
      background: rgba(251, 191, 36, 0.06);
    }

    /* ── Sources ── */
    .sources-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--muted);
      margin: 18px 0 10px;
    }
    .source-list { display: flex; flex-direction: column; gap: 8px; }
    details.source-item {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    details.source-item summary {
      padding: 10px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      list-style: none;
      user-select: none;
    }
    details.source-item summary::-webkit-details-marker { display: none; }
    details.source-item[open] summary { border-bottom: 1px solid var(--border); }
    .source-rank {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      width: 24px; height: 24px;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      flex-shrink: 0;
    }
    .source-doc { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
    .source-score {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      flex-shrink: 0;
    }
    .source-chevron {
      color: var(--muted);
      font-size: 12px;
      flex-shrink: 0;
      transition: transform 0.2s;
    }
    details.source-item[open] .source-chevron { transform: rotate(90deg); }
    .source-body {
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.65;
      color: var(--muted);
      max-height: 180px;
      overflow-y: auto;
    }

    /* ── Spinner ── */
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Usage ── */
    .usage-row {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      gap: 14px;
    }

    /* ── Format hint ── */
    .format-hint {
      margin-top: 14px;
      font-size: 12px;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
    }
    .format-hint code {
      background: var(--surface2);
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 11px;
      font-family: 'Fira Code', 'Cascadia Code', monospace;
      color: var(--green);
    }
  </style>
</head>
<body>

<header class="header">
  <div class="header-logo">Grounded<span>RAG</span></div>
  <div class="header-badge">Phase 1</div>
  <div class="header-status">
    <div class="dot" id="status-dot"></div>
    <span id="status-text">checking…</span>
    <span id="status-chunks" style="margin-left:4px;"></span>
  </div>
</header>

<div class="main">

  <!-- ── Left: Upload panel ── -->
  <div>
    <div class="card">
      <div class="card-title">Index Corpus</div>

      <div class="drop-zone" id="drop-zone">
        <input type="file" id="file-input" accept=".json,.jsonl,.csv" />
        <div class="drop-icon">📂</div>
        <div class="drop-primary">Drop a file or click to browse</div>
        <div class="drop-secondary">JSON, JSONL, or CSV</div>
      </div>

      <div class="file-chosen" id="file-chosen">
        <span>📄</span>
        <span class="file-name" id="file-name"></span>
        <span class="file-size" id="file-size"></span>
      </div>

      <div class="format-hint">
        Each record needs a <code>text</code>, <code>abstract</code>, or <code>content</code> field.<br/>
        Optional: <code>id</code>, <code>title</code>, or any metadata fields.
      </div>

      <div class="controls">
        <label class="checkbox-row">
          <input type="checkbox" id="clear-checkbox" />
          Clear existing index before uploading
        </label>
        <button class="btn-primary" id="upload-btn" disabled>Upload &amp; Index</button>
      </div>

      <!-- Progress -->
      <div class="progress-wrap" id="progress-wrap">
        <div class="progress-header">
          <span class="progress-label" id="progress-label">Indexing…</span>
          <span class="status-pill" id="status-pill">queued</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="progress-detail">
          <span>📄 <b id="p-docs">0</b> / <b id="p-total">?</b> docs</span>
          <span>🔢 <b id="p-chunks">0</b> chunks</span>
          <span id="p-eta-wrap" style="display:none">⏱ ETA <b id="p-eta"></b></span>
          <span>⏳ <b id="p-elapsed">0</b>s elapsed</span>
        </div>
        <div class="error-msg" id="error-msg" style="display:none"></div>
      </div>
    </div>

    <!-- Job history -->
    <div class="card" id="history-card" style="margin-top:16px;display:none">
      <div class="card-title">Recent Jobs</div>
      <div id="job-history-list"></div>
    </div>
  </div>

  <!-- ── Right: Query panel ── -->
  <div>
    <div class="card">
      <div class="card-title">Ask a Question</div>
      <div class="query-input-row">
        <input type="text" id="question-input"
               placeholder="e.g. What causes Alzheimer's disease?"
               autocomplete="off" />
        <button class="btn-secondary" id="query-btn">Ask</button>
      </div>

      <div class="answer-wrap" id="answer-wrap">
        <div class="answer-label">
          Answer
          <span class="model-tag" id="model-tag"></span>
        </div>
        <div class="answer-text" id="answer-text"></div>
        <div class="usage-row" id="usage-row"></div>

        <div class="sources-label" id="sources-label" style="display:none">Sources</div>
        <div class="source-list" id="source-list"></div>
      </div>
    </div>
  </div>

</div>

<script>
// ── Health check ──────────────────────────────────────────────────────────────
async function checkHealth() {
  try {
    const r = await fetch('/health');
    const d = await r.json();
    document.getElementById('status-dot').className = 'dot green';
    document.getElementById('status-text').textContent = 'API online';
    const n = d.indexed_chunks || 0;
    document.getElementById('status-chunks').textContent =
      n > 0 ? `· ${n.toLocaleString()} chunks indexed` : '';
    if (n > 0) loadJobHistory();
  } catch {
    document.getElementById('status-text').textContent = 'API offline';
  }
}
checkHealth();
setInterval(checkHealth, 15000);

// ── File upload ───────────────────────────────────────────────────────────────
const dropZone   = document.getElementById('drop-zone');
const fileInput  = document.getElementById('file-input');
const fileChosen = document.getElementById('file-chosen');
const fileName   = document.getElementById('file-name');
const fileSize   = document.getElementById('file-size');
const uploadBtn  = document.getElementById('upload-btn');

function fmtSize(b) {
  if (b < 1024) return b + ' B';
  if (b < 1024*1024) return (b/1024).toFixed(1) + ' KB';
  return (b/1024/1024).toFixed(1) + ' MB';
}

function setFile(f) {
  if (!f) return;
  fileName.textContent = f.name;
  fileSize.textContent = fmtSize(f.size);
  fileChosen.classList.add('visible');
  uploadBtn.disabled = false;
}

fileInput.addEventListener('change', () => setFile(fileInput.files[0]));

dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  const f = e.dataTransfer.files[0];
  if (f) { fileInput.files = e.dataTransfer.files; setFile(f); }
});

// ── Upload & index ────────────────────────────────────────────────────────────
let pollTimer = null;
let currentJobId = null;

uploadBtn.addEventListener('click', async () => {
  const f = fileInput.files[0];
  if (!f) return;

  uploadBtn.disabled = true;
  const clearExisting = document.getElementById('clear-checkbox').checked;

  const fd = new FormData();
  fd.append('file', f);
  fd.append('clear_existing', clearExisting ? 'true' : 'false');

  try {
    const r = await fetch('/ingest', { method: 'POST', body: fd });
    if (!r.ok) {
      const err = await r.json();
      alert('Upload failed: ' + (err.detail || r.statusText));
      uploadBtn.disabled = false;
      return;
    }
    const d = await r.json();
    currentJobId = d.job_id;
    startPolling(currentJobId);
  } catch (e) {
    alert('Upload failed: ' + e.message);
    uploadBtn.disabled = false;
  }
});

function startPolling(jobId) {
  clearInterval(pollTimer);
  showProgress(null);
  pollTimer = setInterval(() => pollStatus(jobId), 2000);
  pollStatus(jobId);
}

async function pollStatus(jobId) {
  try {
    const r = await fetch(`/ingest/status/${jobId}`);
    const d = await r.json();
    showProgress(d);
    if (d.status === 'done' || d.status === 'error') {
      clearInterval(pollTimer);
      uploadBtn.disabled = false;
      checkHealth();
      loadJobHistory();
    }
  } catch { /* silently ignore network hiccups during polling */ }
}

function showProgress(d) {
  const wrap = document.getElementById('progress-wrap');
  wrap.classList.add('visible');

  if (!d) {
    setPill('queued');
    setProgressPct(0);
    return;
  }

  const { status, progress, percent, eta_seconds, elapsed_seconds, error } = d;
  setPill(status);
  setProgressPct(percent || 0, status);

  document.getElementById('p-docs').textContent    = progress.docs_processed;
  document.getElementById('p-total').textContent   = progress.docs_total || '?';
  document.getElementById('p-chunks').textContent  = progress.chunks_indexed.toLocaleString();
  document.getElementById('p-elapsed').textContent = elapsed_seconds || 0;

  const etaWrap = document.getElementById('p-eta-wrap');
  if (eta_seconds != null) {
    etaWrap.style.display = '';
    document.getElementById('p-eta').textContent = fmtEta(eta_seconds);
  } else {
    etaWrap.style.display = 'none';
  }

  const lbl = document.getElementById('progress-label');
  if (status === 'done')    lbl.textContent = `✅ Done — ${progress.chunks_indexed.toLocaleString()} chunks indexed`;
  else if (status === 'error') lbl.textContent = '❌ Indexing failed';
  else if (status === 'running') lbl.textContent = `Indexing ${d.filename || ''}…`;
  else lbl.textContent = 'Queued…';

  const errEl = document.getElementById('error-msg');
  if (error) { errEl.textContent = error; errEl.style.display = 'block'; }
  else errEl.style.display = 'none';
}

function setPill(status) {
  const pill = document.getElementById('status-pill');
  pill.className = 'status-pill ' + status;
  const icons = { queued: '🕐', running: '⏳', done: '✅', error: '❌' };
  pill.textContent = (icons[status] || '') + ' ' + status;
}

function setProgressPct(pct, status) {
  const fill = document.getElementById('progress-fill');
  fill.style.width = pct + '%';
  fill.className = 'progress-fill' + (status === 'done' ? ' done' : status === 'error' ? ' error' : '');
}

function fmtEta(sec) {
  if (sec < 60) return sec + 's';
  const m = Math.floor(sec / 60), s = sec % 60;
  return `${m}m ${s}s`;
}

// ── Job history ───────────────────────────────────────────────────────────────
async function loadJobHistory() {
  try {
    const r = await fetch('/ingest/jobs');
    const jobs = await r.json();
    if (!jobs.length) return;

    const card = document.getElementById('history-card');
    const list = document.getElementById('job-history-list');
    card.style.display = 'block';
    list.innerHTML = '';

    jobs.slice(0, 5).forEach(j => {
      const row = document.createElement('div');
      row.className = 'job-row';
      const statusIcons = { done: '✅', error: '❌', running: '⏳', queued: '🕐' };
      row.innerHTML = `
        <span>${statusIcons[j.status] || '?'}</span>
        <span class="job-file" title="${j.filename || ''}">${j.filename || '(unknown)'}</span>
        <span style="color:var(--accent)">${j.chunks_indexed.toLocaleString()} chunks</span>
      `;
      list.appendChild(row);
    });
  } catch { /* no history yet */ }
}

// ── Query ─────────────────────────────────────────────────────────────────────
const queryBtn      = document.getElementById('query-btn');
const questionInput = document.getElementById('question-input');

async function runQuery() {
  const q = questionInput.value.trim();
  if (!q) return;

  queryBtn.disabled = true;
  queryBtn.innerHTML = '<div class="spinner"></div>';

  const answerWrap = document.getElementById('answer-wrap');
  const answerText = document.getElementById('answer-text');
  answerText.textContent = '';
  answerText.className = 'answer-text';
  document.getElementById('source-list').innerHTML = '';
  document.getElementById('sources-label').style.display = 'none';
  document.getElementById('usage-row').textContent = '';
  answerWrap.classList.add('visible');

  try {
    const r = await fetch('/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q }),
    });

    if (!r.ok) {
      const err = await r.json();
      answerText.textContent = '⚠️ Error: ' + (err.detail || r.statusText);
      return;
    }

    const d = await r.json();
    const isAbstain = d.answer.startsWith('Insufficient evidence');

    answerText.textContent = d.answer;
    if (isAbstain) answerText.classList.add('abstain');

    if (d.model) {
      document.getElementById('model-tag').textContent = d.model;
    }

    if (d.usage) {
      const u = d.usage;
      document.getElementById('usage-row').textContent =
        `Tokens — in: ${u.input_tokens || 0} · out: ${u.output_tokens || 0}`;
    }

    if (d.chunks && d.chunks.length && !isAbstain) {
      document.getElementById('sources-label').style.display = 'block';
      const list = document.getElementById('source-list');
      d.chunks.slice(0, 5).forEach((c, i) => {
        const det = document.createElement('details');
        det.className = 'source-item';
        const srcLabel = c.source ? c.source.split(/[\\/]/).pop() : c.doc_id;
        det.innerHTML = `
          <summary>
            <span class="source-rank">${i + 1}</span>
            <span class="source-doc" title="${c.source || ''}">${srcLabel}</span>
            <span class="source-score">${(c.score * 100).toFixed(1)}%</span>
            <span class="source-chevron">▶</span>
          </summary>
          <div class="source-body">${escHtml(c.text)}</div>
        `;
        list.appendChild(det);
      });
    }
  } catch (e) {
    answerText.textContent = '⚠️ Request failed: ' + e.message;
  } finally {
    queryBtn.disabled = false;
    queryBtn.textContent = 'Ask';
  }
}

queryBtn.addEventListener('click', runQuery);
questionInput.addEventListener('keydown', e => { if (e.key === 'Enter') runQuery(); });

function escHtml(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
